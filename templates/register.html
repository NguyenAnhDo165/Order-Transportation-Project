<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GoRide – Đăng ký</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0} body{min-height:100vh;font-family:Inter,sans-serif;background:linear-gradient(160deg,#eef2ff,#f0fdf4);display:flex;align-items:center;justify-content:center;color:#0f172a;padding:20px}.card{width:min(430px,100%);background:#fff;border:1px solid #e2e8f0;border-radius:24px;padding:28px;box-shadow:0 20px 60px rgba(15,23,42,.15)}.logo{display:flex;align-items:center;gap:10px;margin-bottom:18px}.icon{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#2563eb,#06b6d4);display:flex;align-items:center;justify-content:center;font-size:22px}.title{font-size:24px;font-weight:800;letter-spacing:-.5px}.sub{color:#64748b;font-size:14px;margin-bottom:20px}.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}.field input{width:100%;height:44px;border:1.5px solid #e2e8f0;border-radius:12px;padding:0 14px;font-size:14px;outline:none}.field input:focus{border-color:#2563eb;background:#eff6ff}.btn{width:100%;height:45px;border:0;border-radius:12px;background:#2563eb;color:white;font-weight:700;cursor:pointer;margin-top:8px}.btn:hover{background:#1d4ed8}.msg{background:#fff1f2;color:#dc2626;border:1px solid #fecaca;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}.foot{font-size:14px;color:#64748b;text-align:center;margin-top:16px}.foot a{color:#2563eb;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <form class="card" method="POST">
    <div class="logo"><div class="icon">🛵</div><div><div class="title">Tạo tài khoản</div><div class="sub">Tài khoản được lưu vào users.csv</div></div></div>
    {% with messages = get_flashed_messages() %}{% if messages %}{% for m in messages %}<div class="msg">{{ m }}</div>{% endfor %}{% endif %}{% endwith %}
    <div class="field"><label>Họ tên</label><input name="full_name" autocomplete="name"></div>
    <div class="field"><label>Tên đăng nhập</label><input name="username" autocomplete="username" required></div>
    <div class="field"><label>Mật khẩu</label><input name="password" type="password" autocomplete="new-password" required></div>
    <div class="field"><label>Nhập lại mật khẩu</label><input name="confirm" type="password" autocomplete="new-password" required></div>
    <button class="btn" type="submit">Đăng ký</button>
    <div class="foot">Đã có tài khoản? <a href="{{ url_for('login') }}">Đăng nhập</a></div>
  </form>
</body>
</html>
